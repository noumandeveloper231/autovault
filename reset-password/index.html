<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password � AutoVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b0e14; --card:#12161b; --border:#232a32; --text:#eaecef; --muted:#8b95a1; --green:#2c9257; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
    .card { width:min(420px,92vw); background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px; }
    h1 { font-family:"Space Grotesk",sans-serif; font-size:26px; margin:0 0 8px; }
    p { color:var(--muted); font-size:14px; margin:0 0 18px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    .pwd-wrap { position:relative; margin-bottom:14px; }
    .pwd-wrap input { width:100%; padding:12px 44px 12px 14px; border-radius:10px; border:1px solid var(--border); background:#0f1419; color:var(--text); margin-bottom:0; }
    .pwd-toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); cursor:pointer; padding:4px; display:flex; width:auto; }
    .pwd-toggle:hover { color:var(--text); }
    button { width:100%; border:0; border-radius:10px; padding:12px; background:var(--green); color:#fff; font-weight:700; cursor:pointer; }
    .msg { margin-top:12px; font-size:13px; display:none; }
    .err { color:#ff7b7b; }
    .ok { color:#46d392; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters.</p>
    <form id="form">
      <label for="password">New password</label>
      <div class="pwd-wrap">
        <input id="password" type="password" minlength="8" required />
        <button type="button" class="pwd-toggle" aria-label="Toggle password visibility" onclick="togglePwd(this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label for="confirm">Confirm password</label>
      <div class="pwd-wrap">
        <input id="confirm" type="password" minlength="8" required />
        <button type="button" class="pwd-toggle" aria-label="Toggle password visibility" onclick="togglePwd(this)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit">Update password</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>
  <script src="/api.js"></script>
  <script>
    function togglePwd(btn) {
      const input = btn.previousElementSibling;
      const isPwd = input.type === "password";
      input.type = isPwd ? "text" : "password";
      btn.innerHTML = isPwd
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      msg.style.display = "block";
      if (password !== confirm) {
        msg.className = "msg err";
        msg.textContent = "Passwords do not match.";
        return;
      }
      try {
        await AVApi.resetPassword({ token, password });
        msg.className = "msg ok";
        msg.textContent = "Password updated. Redirecting to login�";
        setTimeout(() => location.replace("/login"), 1200);
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = err.message || "Reset failed.";
      }
    });
  </script>
</body>
</html>
