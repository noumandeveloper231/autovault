<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept Invite - AutoVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b0e14; --card:#12161b; --border:#232a32; --text:#eaecef; --muted:#8b95a1; --green:#2c9257; --green-2:#46d392; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:radial-gradient(1200px 600px at 20% -10%, #173021, transparent), var(--bg);
      color:var(--text); font-family:Inter,system-ui,sans-serif;
    }
    .card { width:min(440px,92vw); background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px; }
    .brand { font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:18px; margin-bottom:18px; }
    .eyebrow { color:var(--green-2); font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; margin-bottom:8px; }
    h1 { font-family:"Space Grotesk",sans-serif; font-size:26px; margin:0 0 8px; }
    p { color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 18px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    input {
      width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
      background:#0f1419; color:var(--text); margin-bottom:14px; font:inherit;
    }
    input:focus { outline:none; border-color:rgba(44,146,87,.55); }
    button {
      width:100%; border:0; border-radius:10px; padding:12px; background:var(--green);
      color:#fff; font-weight:700; cursor:pointer; font:inherit;
    }
    button:disabled { opacity:.65; cursor:wait; }
    .msg { margin-top:12px; font-size:13px; display:none; }
    .err { color:#ff7b7b; }
    .ok { color:var(--green-2); }
    .hint { margin-top:14px; font-size:13px; }
    .hint a { color:var(--green-2); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">AutoVault</div>
    <div class="eyebrow">Team invitation</div>
    <h1>Join your dealership</h1>
    <p>Create your password to activate your AutoVault account. This link expires in 7 days.</p>
    <form id="form">
      <label for="fullName">Full name</label>
      <input id="fullName" type="text" required autocomplete="name" placeholder="Your full name" />
      <label for="password">Password</label>
      <input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Re-enter password" />
      <button type="submit" id="submitBtn">Accept invitation</button>
    </form>
    <p class="msg" id="msg"></p>
    <p class="hint"><a href="/login">Already have an account? Log in</a></p>
  </div>
  <script src="/api.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");

    function loginPathForRole(role) {
      if (role === "platform_owner") return "/owner/login";
      return "/login";
    }

    if (!token) {
      msg.style.display = "block";
      msg.className = "msg err";
      msg.textContent = "This invite link is missing a token. Open the link from your email.";
      btn.disabled = true;
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullName = document.getElementById("fullName").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      msg.style.display = "block";
      msg.className = "msg";

      if (!fullName) {
        msg.className = "msg err";
        msg.textContent = "Enter your full name.";
        return;
      }
      if (password.length < 8) {
        msg.className = "msg err";
        msg.textContent = "Password must be at least 8 characters.";
        return;
      }
      if (password !== confirm) {
        msg.className = "msg err";
        msg.textContent = "Passwords do not match.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Activating...";
      try {
        const res = await AVApi.request("/api/v1/invitations/accept", {
          method: "POST",
          body: JSON.stringify({ token, fullName, password }),
          skipAuth: true,
        });
        const user = (res && (res.user || res)) || {};
        const path = loginPathForRole(user.role);
        msg.className = "msg ok";
        msg.textContent = "Account created. Redirecting to login...";
        setTimeout(() => location.replace(path), 1200);
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = err.message || "Invite invalid or expired.";
        btn.disabled = false;
        btn.textContent = "Accept invitation";
      }
    });
  </script>
</body>
</html>
