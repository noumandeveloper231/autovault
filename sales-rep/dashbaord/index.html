<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Rep Portal | AutoVault360</title>
  <meta name="robots" content="noindex, nofollow" />
  <script>
    // Typo path — send to Fully Loaded SPA. Preserve query (impHandoff).
    var params = new URLSearchParams(location.search || "");
    if (!params.has("portal")) params.set("portal", "sales_rep");
    window.location.replace(
      "/dashboard?" + params.toString() + (location.hash || "")
    );
  </script>
</head>
<body>
  <p>Redirecting… <a href="/dashboard?portal=sales_rep">Continue</a></p>
</body>
</html>
